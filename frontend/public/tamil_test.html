<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <title>Tamil Glyph Reference Test</title>
  <style>
    body { font-family: 'Nirmala UI', 'Latha', sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
    .card { background: #1e293b; border-radius: 8px; padding: 15px; text-align: center; }
    .glyph-display { font-size: 80px; height: 100px; line-height: 100px; color: #38bdf8; }
    .meta { font-size: 14px; color: #94a3b8; font-weight: bold; margin-bottom: 5px; }
    canvas { background: #334155; border-radius: 6px; margin-top: 10px; border: 1px solid #475569; }
    .info { font-size: 11px; color: #cbd5e1; margin-top: 6px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>StrokeSpeak — Tamil Vowels Exact Glyph Reference</h1>
  <div class="grid" id="grid"></div>

  <script>
    const chars = [
      { text: "அ", id: 25 },
      { text: "ஆ", id: 110 },
      { text: "இ", id: 111 },
      { text: "ஈ", id: 112 },
      { text: "உ", id: 113 },
      { text: "ஊ", id: 114 },
      { text: "எ", id: 115 },
      { text: "ஏ", id: 116 },
      { text: "ஐ", id: 117 },
      { text: "ஒ", id: 118 }
    ];

    const grid = document.getElementById("grid");

    chars.forEach((c, idx) => {
      const card = document.createElement("div");
      card.className = "card";

      const glyphDiv = document.createElement("div");
      glyphDiv.className = "glyph-display";
      glyphDiv.textContent = c.text;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${idx + 1}. ${c.text} (ID ${c.id})`;

      const canvas = document.createElement("canvas");
      canvas.width = 100;
      canvas.height = 100;
      const ctx = canvas.getContext("2d");

      // Draw background grid lines (center at 50, 50)
      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(50, 0); ctx.lineTo(50, 100);
      ctx.moveTo(0, 50); ctx.lineTo(100, 50);
      ctx.stroke();

      // Render font glyph in canvas
      ctx.font = "bold 56px 'Nirmala UI', 'Latha', sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(c.text, 50, 52);

      // Measure bounding box of non-empty pixels
      const imgData = ctx.getImageData(0, 0, 100, 100);
      let minX = 100, maxX = 0, minY = 100, maxY = 0;
      for (let y = 0; y < 100; y++) {
        for (let x = 0; x < 100; x++) {
          const alpha = imgData.data[(y * 100 + x) * 4 + 3];
          const r = imgData.data[(y * 100 + x) * 4];
          if (alpha > 50 && r > 100) { // white text pixel
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const info = document.createElement("div");
      info.className = "info";
      info.textContent = `X:[${minX}, ${maxX}] Y:[${minY}, ${maxY}] W:${maxX - minX} H:${maxY - minY}`;

      card.appendChild(meta);
      card.appendChild(glyphDiv);
      card.appendChild(canvas);
      card.appendChild(info);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
